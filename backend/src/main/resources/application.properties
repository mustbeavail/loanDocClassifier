spring.application.name=doc-classifier

# 백엔드 포트. 프론트엔드(Next.js)가 3000번을 쓰므로 겹치지 않게 8080을 그대로 사용한다
server.port=8080

# PDF 패키지는 수십 MB까지 커질 수 있어 업로드 용량 기본값(1MB)을 올려 둔다
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 로컬 전용 설정 파일. 저장소에 올라가지 않으며, 없으면 그냥 무시된다
spring.config.import=optional:classpath:application-local.properties

# Gemini 2차 판정 설정
# API 키는 이 파일에 적지 않는다. 아래 둘 중 하나로 주입한다
#   1) 환경변수 GOOGLE_API_KEY
#   2) src/main/resources/application-local.properties 에 gemini.api-key=키값
# 키가 없어도 애플리케이션은 뜬다. 그때는 2차 판정만 건너뛰고 규칙 분류 결과까지 나온다
gemini.api-key=${GOOGLE_API_KEY:}
gemini.model=gemini-3.6-flash
